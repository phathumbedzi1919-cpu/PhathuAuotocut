<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoCut Studio Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🎬 AutoCut Studio Pro</h1>

<p>Create Professional YouTube Shorts Offline</p>

</header>

<div class="container">

<!-- Photos -->

<section class="card">

<h2>📷 Photos</h2>

<input
type="file"
id="imageInput"
accept="image/*"
multiple
hidden>

<button id="addPhotoBtn">

➕ Add Photos

</button>

<p id="photoCount">

Selected Photos : 0

</p>

<div id="gallery"></div>

</section>

<!-- Music -->

<section class="card">

<h2>🎵 Background Music</h2>

<input
type="file"
id="musicInput"
accept="audio/*"
hidden>

<button id="addMusicBtn">

🎵 Add Music

</button>

<p id="musicName">

No Music Selected

</p>

</section>

<!-- Voice -->

<section class="card">

<h2>🎙 Voice Over</h2>

<input
type="file"
id="voiceInput"
accept="audio/*"
hidden>

<button id="addVoiceBtn">

🎙 Add Voice

</button>

<p id="voiceName">

No Voice Selected

</p>

</section>

<!-- Motion -->

<section class="card">

<h2>🎬 Motion Engine</h2>

<select id="motionMode">

<option value="preserve">

Preserve Motion (Recommended)

</option>

<option value="cinematic">

Cinematic Motion

</option>

</select>

</section>

<!-- Frames -->

<section class="card">

<h2>🖼 Picture Frame</h2>

<select id="frameStyle">

<option value="white">

White Canva Frame

</option>

<option value="black">

Black Frame

</option>

<option value="none">

No Frame

</option>

</select>

</section>

<!-- Duration -->

<section class="card">

<h2>⏱ Duration Per Photo</h2>

<select id="duration">

<option value="2">2 Seconds</option>

<option value="3">3 Seconds</option>

<option value="5" selected>5 Seconds</option>

<option value="7">7 Seconds</option>

</select>

</section>

<!-- Preview -->

<section class="card">

<h2>👀 Preview</h2>

<div id="preview">

<p>Preview will appear here</p>

</div>

<div class="controls">

<button id="previewBtn">

▶ Preview

</button>

<button id="pauseBtn">

⏸ Pause

</button>

</div>

<div id="progressBar">

<div id="progress"></div>

</div>

</section>

<!-- Export -->

<section class="card">

<h2>💾 Export</h2>

<button id="saveBtn">

💾 Save MP4 Video

</button>

<p id="status">

Waiting...

</p>

</section>

</div>

<!-- Libraries -->

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<!-- Project Files -->

<script src="motion.js"></script>

<script src="audio.js"></script>

<script src="renderer.js"></script>

<script src="script.js"></script>

</body>

    </html>
