<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoCut Lite</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🎬 AutoCut Lite</h1>

<p>Create YouTube Shorts Automatically</p>

</header>

<main class="container">

<!-- Photos -->

<section class="card">

<h2>📷 Photos</h2>

<input
type="file"
id="imageInput"
accept="image/*"
multiple
hidden>

<button id="addPhotoBtn">

➕ Add Photos

</button>

<p id="photoCount">

Selected Photos: 0

</p>

<div id="gallery"></div>

</section>

<!-- Music -->

<section class="card">

<h2>🎵 Background Music</h2>

<input
type="file"
id="musicInput"
accept="audio/*"
hidden>

<button id="addMusicBtn">

🎵 Choose Music

</button>

<p id="musicName">

No music selected

</p>

</section>

<!-- Video Settings -->

<section class="card">

<h2>⚙ Video Settings</h2>

<label>

Photo Duration

</label>

<select id="duration">

<option value="2">2 Seconds</option>

<option value="3">3 Seconds</option>

<option value="5" selected>5 Seconds</option>

<option value="7">7 Seconds</option>

</select>

</section>

<!-- Preview -->

<section class="card">

<h2>👀 Preview</h2>

<div id="preview">

<p>

Preview will appear here

</p>

</div>

<div class="buttons">

<button id="previewBtn">

▶ Preview

</button>

<button id="saveBtn">

💾 Save Video

</button>

</div>

<div id="progressBar">

<div id="progress"></div>

</div>

<p id="status">

Waiting...

</p>

</section>

<!-- Hidden Canvas -->

<canvas
id="videoCanvas"
width="1080"
height="1920"
style="display:none;">
</canvas>

</main>

<script src="script.js"></script>

</body>

</html>
